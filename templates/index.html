<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口：让网页在手机上以合适的宽度显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- iOS Safari 全屏模式支持 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>每日财经快报</title>

    <!-- 内联 SVG 图标（📰），避免额外的 favicon 请求 -->
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn5OwPC90ZXh0Pjwvc3ZnPg==">

    <!-- 相对路径：站点可部署在任意子路径下 -->
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <!-- ======== 顶部导航栏 ======== -->
    <header class="header">
        <div class="header-inner">
            <div>
                <div class="header-title">
                    <span class="icon">📰</span>每日财经快报
                </div>
                <div class="header-date" id="headerDate"></div>
            </div>
        </div>
    </header>

    <!-- ======== 主内容区 ======== -->
    <main class="main">

        <!-- 状态栏（数据就绪后由 JS 显示） -->
        <div class="stats-bar" id="statsBar" hidden>
            <span>📊 共 <span class="count" id="newsCount">0</span> 条新闻</span>
            <span class="stats-dot" id="statsDot"></span>
            <span id="statsText" style="font-size:12px;"></span>
        </div>

        <!-- 搜索 + 筛选（数据就绪后由 JS 显示） -->
        <div class="toolbar" id="toolbar" hidden>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="search" id="searchInput" placeholder="搜索标题、来源、内容…" oninput="renderNews()">
            </div>
            <div class="filter-chips" id="filterChips">
                <!-- JS 动态生成 -->
            </div>
        </div>

        <!-- 新闻列表容器 -->
        <div class="news-list" id="newsList"></div>

        <!-- 底部 -->
        <div class="footer">
            每日财经快报 · 数据来自公开 RSS 源 · 每日 12:00 自动更新<br>
            <span id="updatedAt"></span>
        </div>
    </main>

    <!-- 构建时由 build.py 在此注入新闻数据（window.__NEWS_DATA__） -->
    <!--__NEWS_DATA__-->

    <script src="static/app.js"></script>
</body>
</html>
