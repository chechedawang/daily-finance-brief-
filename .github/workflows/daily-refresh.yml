# 每日快报 - 自动构建与发布
# ============================================================
# 流程：抓取新闻 → 生成静态站点 → 推送到 gh-pages 分支
#       Render Static Site 监听 gh-pages 自动发布（无休眠、无冷启动）
#
# cron 基于 UTC：04:00 UTC = 北京时间 12:00
# 注：Actions 定时任务在高峰期可能延迟数分钟到数十分钟，属正常现象。
name: 每日快报刷新

on:
  schedule:
    - cron: "0 4 * * *"    # 每天 UTC 04:00 = 北京时间 12:00
  workflow_dispatch:        # 支持手动触发（页面点 Run workflow）

# 需要写权限才能推送 gh-pages 分支
permissions:
  contents: write

# 同一时间只跑一个，避免两次构建互相覆盖
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 抓取失败（有效文章过少）时 build.py 会以非 0 退出，
      # 从而中断整个 job，上一版站点保持不变。
      - name: 抓取并生成静态站点
        run: python build.py

      - name: 发布到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🚀 发布构建产物到 gh-pages..."
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "更新快报 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "✅ 已发布，Render 将自动部署"
